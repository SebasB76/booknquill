[package]
name = "booknquill"
version = "0.1.0"
description = "A quiet desktop notes app"
license = "MIT"
edition = "2021"
default-run = "booknquill"

[lib]
name = "booknquill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "e2e_bridge"
path = "src/bin/e2e_bridge.rs"
required-features = ["e2e-bridge"]

[features]
e2e-bridge = ["dep:axum", "dep:tokio", "dep:tokio-stream", "dep:tower-http"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8.9", optional = true }
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1.54.1", features = ["full"], optional = true }
tokio-stream = { version = "0.1.19", features = ["sync"], optional = true }
tower-http = { version = "0.7.1", features = ["cors"], optional = true }

